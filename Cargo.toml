[workspace]
resolver = "3"
members = ["crates/taskboard-core", "crates/tb", "crates/taskboard", "crates/taskboard-wasm-spike"]
# Vendored crates are patched dependencies, not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
taskboard-core = { path = "crates/taskboard-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
thiserror = "2"
tempfile = "3"

# iced_wgpu 0.14.0 with one wasm32-only change: an array-free triangle
# gradient shader, because Mali GPUs reject the original once wgpu turns it
# into GLSL ES for WebGL2. Native builds compile the upstream shader. See
# vendor/README.md.
[patch.crates-io]
iced_wgpu = { path = "vendor/iced_wgpu" }
