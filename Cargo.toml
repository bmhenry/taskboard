[workspace]
resolver = "3"
members = ["crates/taskboard-core", "crates/tb", "crates/taskboard"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
taskboard-core = { path = "crates/taskboard-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = { version = "3", features = ["serde"] }
thiserror = "2"
tempfile = "3"
