[package]
name = "taskboard-wasm"
version.workspace = true
edition.workspace = true
description = "Taskboard's web client: the iced UI in the browser, over taskboard-web's API"
publish = false

# Everything is wasm-only, so `cargo build/test --workspace` on the desktop
# only builds an empty stub binary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
taskboard-core.workspace = true
# No tokio: taskboard-ui only enables it off wasm32.
taskboard-ui.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
serde.workspace = true
serde_json.workspace = true
# No `tokio`: iced uses wasm-bindgen-futures on the web. `webgl` lets wgpu
# fall back to WebGL2 where WebGPU isn't available.
iced = { version = "0.14", features = ["advanced", "webgl"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "Blob",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventSource",
  "EventTarget",
  "File",
  "FileList",
  "FocusOptions",
  "Headers",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlTextAreaElement",
  "InputEvent",
  "KeyboardEvent",
  "KeyboardEventInit",
  "MessageEvent",
  "PointerEvent",
  "Request",
  "RequestCredentials",
  "RequestInit",
  "Response",
  "Storage",
  "VisualViewport",
  "Window",
] }
unicode-segmentation = "1"

# src/text_diff.rs is also unit tested natively.
[dev-dependencies]
unicode-segmentation = "1"
