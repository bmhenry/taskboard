[package]
name = "taskboard-wasm-spike"
version.workspace = true
edition.workspace = true
description = "Phase 0 spike: the taskboard GUI built for wasm32 with a fixture board"
publish = false

# Everything is wasm-only, so `cargo build/test --workspace` on the desktop
# only builds an empty stub binary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
taskboard-core.workspace = true
# Without `desktop`: no file dialogs and no tokio.
taskboard-ui.workspace = true
chrono = { workspace = true, features = ["wasmbind"] }
# No `tokio`: iced uses wasm-bindgen-futures on the web. `webgl` lets wgpu
# fall back to WebGL2 where WebGPU isn't available.
iced = { version = "0.14", features = ["advanced", "webgl"] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
# The hidden-textarea soft-keyboard bridge (src/keyboard.rs).
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "AddEventListenerOptions",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "FocusOptions",
  "HtmlElement",
  "HtmlTextAreaElement",
  "InputEvent",
  "KeyboardEvent",
  "KeyboardEventInit",
  "PointerEvent",
  "VisualViewport",
  "Window",
] }
unicode-segmentation = "1"

# src/text_diff.rs is also unit tested natively.
[dev-dependencies]
unicode-segmentation = "1"
