[package]
name = "taskboard"
version.workspace = true
edition.workspace = true
description = "Local Kanban GUI for Taskboard"

[dependencies]
taskboard-core.workspace = true
chrono.workspace = true
iced = { version = "0.14", features = ["image", "canvas", "advanced", "tokio"] }
# Pinned exactly: published by a fork with frequent releases; review diffs before bumping.
iced_drop = "=0.2.54"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile.workspace = true
