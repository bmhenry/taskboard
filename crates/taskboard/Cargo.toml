[package]
name = "taskboard"
version.workspace = true
edition.workspace = true
description = "Local Kanban GUI for Taskboard"

[dependencies]
taskboard-core = { workspace = true, features = ["watch"] }
taskboard-ui.workspace = true
iced = { version = "0.14", features = ["tokio"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
tempfile.workspace = true
